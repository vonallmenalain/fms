[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Achtung, zwei verschiedene Node-Versionen: NODE_VERSION gilt nur für den Bau,
  # die Funktionen laufen in einer eigenen Laufzeit. Sie muss hier ausdrücklich
  # gesetzt werden, sonst nimmt Netlify eine ältere.
  #
  # Node 22, weil firebase-admin `>=22` verlangt. Es reicht allein aber nicht:
  # AWS' nodejs22.x liegt bei 22.11, und require() eines ES-Moduls gibt es erst
  # ab 22.12 — genau daran starb die Funktion beim Laden («require() of ES Module
  # …/jose/… not supported», Netlify antwortet 502, die App fällt auf die
  # Firebase-Mail zurück). Verlassen tun wir uns darum nicht auf die Laufzeit,
  # sondern auf `overrides` in package.json: jose 5 bringt CommonJS mit.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

# Serverseitiger Teil: zwei Funktionen, beide nur für den Mailversand —
# die Bestätigungsmail und der Anmeldelink (netlify/functions/). Sie brauchen
# einen Server, weil weder der Resend-Schlüssel noch der Firebase-Dienstschlüssel
# jemals ins Browser-Bündel gelangen dürfen. Im Gast-Ablauf steckt nach wie vor
# kein Serverkode.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Das Admin-SDK bringt eigene Binärteile und optionale Abhängigkeiten mit,
  # die esbuild nicht einpacken kann; extern eingebunden nimmt Netlify es
  # unverändert aus node_modules mit.
  external_node_modules = ["firebase-admin"]

# Die Funktionen melden ihren Pfad zwar selbst (config.path), die Regel hier
# steht aber VOR dem Auffangnetz für die Einzelseiten-App — ohne sie
# beantwortet /index.html den Aufruf und die Mail ginge stillschweigend nicht raus.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
